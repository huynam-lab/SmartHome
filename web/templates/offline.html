<!doctype html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Smart Home Offline</title>
    <meta name="theme-color" content="#BFB8DA" />
    <link rel="stylesheet" href="/static/style.css?v=20260522b" />
</head>

<body>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-grid"></div>

    <main class="offline-shell">
        <section class="offline-card glass-card">
            <p class="eyebrow">Offline Mode</p>
            <h1>Đang mất kết nối</h1>
            <p class="offline-copy">
                Không có wifi, không có kết nối internet. Vui lòng kiểm tra lại kết nối của bạn và thử lại.
            </p>
            <button type="button" class="primary-btn" onclick="window.location.reload()">Thử lại</button>
        </section>
    </main>
</body>
